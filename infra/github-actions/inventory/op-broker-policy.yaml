schema_version: 1
policy_version: 2026-08-20.4
issuer: https://token.actions.githubusercontent.com
discovery_url: https://token.actions.githubusercontent.com/.well-known/openid-configuration
jwks_uri: https://token.actions.githubusercontent.com/.well-known/jwks
organization:
  login: Ken-Technology
  id: 270069411
protocol:
  socket_type: SOCK_SEQPACKET
  packet_bytes_max: 65536
  oidc_token_bytes_max: 16384
  github_token_bytes_max: 4096
  first_packet_timeout_seconds: 5
  socket_backlog: 16
  response_fields: [version, request_id, status, reason_code]
  response_statuses: [accepted, succeeded, rejected, failed]
jwks:
  algorithms: [RS256]
  connect_timeout_seconds: 3
  read_timeout_seconds: 5
  response_bytes_max: 1048576
  freshness_min_seconds: 300
  freshness_max_seconds: 21600
  clock_skew_seconds: 30
  token_lifetime_max_seconds: 600
github_api:
  origin: https://api.github.com
  redirects: reject
  response_bytes_max: 1048576
  allowed_get_templates:
    - /repositories/{repository_id}
    - /repos/{owner}/{repository}/actions/runs/{run_id}/attempts/{run_attempt}
    - /repos/{owner}/{repository}/actions/jobs/{check_run_id}
    - /repos/{owner}/{repository}/actions/artifacts/{artifact_id}
    - /repos/{owner}/{repository}/git/commits/{sha}
artifact:
  upload_action: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
  overwrite: false
  retention_days: 3
  api_digest_pattern: '^sha256:[0-9a-f]{64}$'
  descriptors: exactly-one-read-only-regular-file
  reject_entries: [absolute, traversal, symlink, hardlink, device, fifo, socket, sparse, duplicate, case-collision]
source_commit:
  object_format: sha1
  redirects: reject
  shared_cache: false
  alternates: false
  partial_clone: false
  bundle_uri: false
  lfs: reject
  submodules: reject
  symlinks: reject
  checkout: false
  archive: false
  materialization_modes: ['100644', '100755']
  forbidden_command_tokens:
    - dotnet build
    - dotnet publish
    - dotnet pack
    - npm install
    - npm run build
    - npm publish
    - pnpm install
    - pnpm build
    - pnpm publish
    - yarn install
    - yarn build
    - docker build
    - buildctl build
    - make package
    - python -m build
    - cargo publish
    - mvn package
    - gradle build
    - mix hex.publish
credentials:
  command: [/usr/local/bin/op, inject]
  credential_name: op-service-account-token
  credential_source_mode: '0700-root-only'
  delivery: one-use-anonymous-pipe
  connect_environment: forbidden
  operations: [inject]
  output_owner: root
deploy_leases:
  ordinary_slots: 2
  writer_preference: true
  production_build_holds_both: true
  recovery: fail-closed-reap-then-release
firewall_phase_interface:
  command: [/usr/local/libexec/ken-actions-guest-firewall, phase]
  arguments: [--request-id, '{request_id}', --profile, '{network_profile}', --phase, '{phase}', --state, '{activate|deactivate}']
  target_authority: policy-only
  activation: root-created-request-id
  teardown: mandatory-on-exit
  profiles:
    github-control-ci: [oidc-discovery, oidc-jwks, github-api, github-smart-https]
    github-control-nonproduction: [oidc-discovery, oidc-jwks, github-api, github-smart-https]
    github-control-production: [oidc-discovery, oidc-jwks, github-api, github-smart-https]
    vexa-production-fixed-target: [vexa-ssh, vexa-public-health]
    website-production-fixed-target: [website-ssh, ken-so-public-health, getken-ai-separation]
    beehiiv-api-fixed-target: [beehiiv-api]
    github-ssh-ken-website-fixed-target: [github-ssh]
    frontend-production-digest-deploy: [node-base-read, package-read, build-offline, posthog-upload, ghcr-write, frontend-deploy, frontend-public-health]
