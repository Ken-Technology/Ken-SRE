http_port 192.168.211.1:3128
visible_hostname ken-actions-artifact-proxy

acl CONNECT method CONNECT
acl SSL_ports port 443
acl blob_host dstdom_regex ^[a-z0-9]{3,24}[.]blob[.]core[.]windows[.]net$
acl blob_authority url_regex ^[a-z0-9]{3,24}[.]blob[.]core[.]windows[.]net:443$
acl private_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl ipv6_dst dst ipv6

http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !blob_host
http_access deny !blob_authority
http_access deny private_v4
http_access deny ipv6_dst
http_access allow CONNECT SSL_ports blob_host blob_authority
http_access deny all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
request_header_access Proxy-Authorization deny all
request_header_access Authorization deny all
via off
forwarded_for delete
dns_v4_first on
dns_nameservers 127.0.0.53

access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /run/ken-actions-artifact-proxy/squid.pid
coredump_dir /var/lib/ken-actions-artifact-proxy
